name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "CUDA ${{ matrix.cuda }} / ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: "VS 17 2022"
            cuda: "12.9.1"

          - os: windows-2025
            label: "VS 17 2022"
            cuda: "13.2.0"

          - os: windows-2025-vs2026
            label: "VS 18 2026"
            cuda: "13.2.0"
            pack: true # This job will be responsible for packing and uploading the NuGet packages

          - os: ubuntu-22.04
            label: "Linux GCC 11"
            cuda: "12.9.1"

          - os: ubuntu-latest
            label: "Linux GCC 13"
            cuda: "13.2.0"

          - os: ubuntu-22.04
            label: "Linux Clang 14"
            cuda: "12.9.1"
            clang_version: "14"
            nvcc_extra_flags: "-ccbin clang++-14"

          - os: ubuntu-latest
            label: "Linux Clang 18"
            cuda: "13.2.0"
            clang_version: "18"
            nvcc_extra_flags: "-ccbin clang++-18"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # This action is Windows-only because on Linux containers we use the CUDA development images.
      - name: Install CUDA Toolkit ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: true

      # # Set up the MSVC Developer Command Prompt on Windows so that cl.exe can
      # # find its own CRT headers (INCLUDE/LIB env vars) when used as nvcc's
      # # host compiler. This is a no-op on Linux.
      # - name: Set up MSVC Developer environment
      #   uses: ilammy/msvc-dev-cmd@v1
      #   with:
      #     arch: x64

      - name: Install Clang ${{ matrix.clang_version }}
        if: runner.os == 'Linux' && matrix.clang_version != ''
        run: sudo apt-get install -y clang-${{ matrix.clang_version }}

      # Set up .NET SDKs
      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        shell: bash
        run: |
          dotnet restore -p:Platform="Any CPU"
          dotnet build -c Release --no-restore -p:KernelSharpNvccExtraFlags="${{ matrix.nvcc_extra_flags }}" -p:KernelSharpVerbosity=detailed

      - name: Test
        shell: bash
        run: |
          dotnet test -c Release --no-build
  
      - name: Pack
        if: matrix.pack == true
        shell: bash
        run: |
          dotnet restore -p:Platform="Any CPU"
          dotnet pack -c Release --no-build -o ./nupkgs

      - name: Upload NuGet packages
        if: matrix.pack == true
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./nupkgs
