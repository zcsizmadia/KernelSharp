name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: "CUDA ${{ matrix.cuda }} / ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: "VS 17 2022"
            cuda: "12.9.1"

          - os: windows-2025
            label: "VS 17 2022"
            cuda: "13.2.0"

          - os: windows-2025-vs2026
            label: "VS 18 2026"
            cuda: "13.2.0"
            pack: true # This job will be responsible for packing and uploading the NuGet packages

          - os: ubuntu-latest
            label: "Linux GCC"
            cuda: "12.9.1"
            container: nvidia/cuda:12.9.1-devel-ubuntu22.04

          - os: ubuntu-latest
            label: "Linux GCC"
            cuda: "13.2.0"
            container: nvidia/cuda:13.2.0-devel-ubuntu24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install CUDA Toolkit ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        if: runner.os == 'Windows'
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          use-github-cache: true

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        shell: bash
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test
        shell: bash
        run: |
          dotnet test -c Release --no-build
  
      - name: Pack
        if: matrix.pack == true
        shell: bash
        run: |
          dotnet restore
          dotnet pack -c Release --no-build -o ./nupkgs

      - name: Upload NuGet packages
        if: matrix.pack == true
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./nupkgs
